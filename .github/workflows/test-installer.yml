name: Test Installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    # 1. リポジトリをクローン
    - name: Checkout code
      uses: actions/checkout@v3

    # Homebrew casks require macOS. Install the script's missing prerequisite.
    - name: Install Cargo
      run: brew install cargo

    - name: Run installer
      run: |
        cd installer
        bash normal_install.sh
